[package]
name = "vsdb_core"
version = "19.0.4"
authors = ["hui.fan@mail.ru"]
edition = "2024"
description = "A std-collection-like database"
homepage = "https://github.com/rust-util-collections/vsdb"
repository = "https://github.com/rust-util-collections/vsdb/tree/master/core"
keywords = ["kv", "leveldb", "lsm", "std"]
categories = ["database-implementations", "data-structures", "algorithms", "caching"]
license = "MIT"
include.workspace = true

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
rand = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
postcard = { workspace = true }

crc32fast = "1.5.6"
smallvec = { workspace = true }
mmdb = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[features]
default = []

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "basic"
harness = false

[[bench]]
name = "cache_pool"
harness = false
