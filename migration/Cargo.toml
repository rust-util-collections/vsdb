[package]
name = "vsdb_migrate"
version = "18.0.0"
edition = "2024"
license = "MIT"
description = "Offline VSDB v17/v18 universe and MMDB v4 to v5 migration"
repository = "https://github.com/rust-util-collections/vsdb"

[dependencies]
vsdb = { path = "../strata", version = "18" }
vsdb_core = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
mmdb = { workspace = true }
mmdb_v4 = { workspace = true }
tempfile = "3.27.0"
renamest = "0.1.3"
sha3 = { workspace = true }

[target.'cfg(not(unix))'.dependencies]
same-file = "1.0.6"
