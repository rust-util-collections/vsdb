[workspace]
members = [
    "core",
    "strata",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2.0.21"

parking_lot = "0.13"
smallvec = { version = "1.16.6", features = ["serde"] }

serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.2.0", features = ["alloc", "use-std"] }
sha3 = "0.12.0"

mmdb = "6.0.1"

vsdb_core = { path = "core", version = "19.0.1", default-features = false }

criterion = "0.8.2"
rand = "0.10.4"
