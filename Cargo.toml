[workspace]
members = [
    "core",
    "strata",
    "migration",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2.0.21"

parking_lot = "0.13"

serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
sha3 = "0.12.0"

mmdb = "4.3.12"

vsdb_core = { path = "core", version = "18.0.0", default-features = false }

criterion = "0.8.2"
rand = "0.10.3"
