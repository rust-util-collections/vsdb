[workspace]
members = [
    "core",
    "strata",
]
resolver = "3"

[workspace.dependencies]
ruc = "11.0.1"
thiserror = "2.0.21"

parking_lot = "0.13"

serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "=1.1.3", features = ["alloc"] }
sha3 = "0.12.0"

mmdb = "4.3.7"

vsdb_core = { path = "core", version = "17.0.15", default-features = false }

criterion = "0.8.2"
rand = "0.10.3"
